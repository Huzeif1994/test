services:
  playwright:
    build: .
    image: playwright-huzeif:latest
    env_file:
      - path: .env
        required: false
    environment:
      - CI=true
      - TEST_ENV=${TEST_ENV:-dev}
    # Reports host machine par aa jayengi
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./allure-results:/app/allure-results
    ipc: host          # Chromium crash se bachne ke liye
    init: true
