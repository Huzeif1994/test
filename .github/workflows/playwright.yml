name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # manual run ke liye
  schedule:
    - cron: '45 6 * * *'   # roz dopahar 12:15 PM IST (06:45 UTC)

env:
  TEST_ENV: ${{ vars.TEST_ENV || 'dev' }}
  ORDERING_DEV_URL: ${{ vars.ORDERING_DEV_URL || 'https://ftx.dev.ftxcommerce.com' }}
  ORDERING_DEV_USER: ${{ secrets.ORDERING_DEV_USER }}
  ORDERING_DEV_PASSWORD: ${{ secrets.ORDERING_DEV_PASSWORD }}
  ADMIN_DEV_URL: ${{ vars.ADMIN_DEV_URL || 'https://ftx.admin.dev.ftxcommerce.com/' }}
  ADMIN_DEV_USER: ${{ secrets.ADMIN_DEV_USER }}
  ADMIN_DEV_PASSWORD: ${{ secrets.ADMIN_DEV_PASSWORD }}
  FULFILLMENT_DEV_URL: ${{ vars.FULFILLMENT_DEV_URL || 'https://ftx.fulfillment.dev.ftxcommerce.com/' }}
  FULFILLMENT_DEV_USER: ${{ secrets.FULFILLMENT_DEV_USER }}
  FULFILLMENT_DEV_PASSWORD: ${{ secrets.FULFILLMENT_DEV_PASSWORD }}
  ORDERING_STAGING_URL: ${{ vars.ORDERING_STAGING_URL || 'https://ftx.staging.ftxcommerce.com' }}
  ORDERING_STAGING_USER: ${{ secrets.ORDERING_STAGING_USER }}
  ORDERING_STAGING_PASSWORD: ${{ secrets.ORDERING_STAGING_PASSWORD }}
  ADMIN_STAGING_URL: ${{ vars.ADMIN_STAGING_URL || 'https://ftx.admin.staging.ftxcommerce.com/' }}
  ADMIN_STAGING_USER: ${{ secrets.ADMIN_STAGING_USER }}
  ADMIN_STAGING_PASSWORD: ${{ secrets.ADMIN_STAGING_PASSWORD }}
  FULFILLMENT_STAGING_URL: ${{ vars.FULFILLMENT_STAGING_URL || 'https://ftx.fulfillment.staging.ftxcommerce.com/' }}
  FULFILLMENT_STAGING_USER: ${{ secrets.FULFILLMENT_STAGING_USER }}
  FULFILLMENT_STAGING_PASSWORD: ${{ secrets.FULFILLMENT_STAGING_PASSWORD }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: Normal run (Docker ke bina), 3 apps parallel
  test:
    name: Tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [ordering, admin, fulfillment]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Enforce Quality Gate (Typecheck + Unit Tests + Mapping Validation)
        run: npm run quality:gate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Allure ke raw results (agle job mein teeno browsers ke results jodenge)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

  # Job 1.5: Cross-App E2E Bridge (Runs after ordering to prevent shared storefront cart collision)
  e2e-bridge:
    name: Tests (e2e-bridge)
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E Bridge tests
        run: npx playwright test --project=e2e-bridge

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e-bridge
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-e2e-bridge
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

  # Job 2: Teeno browsers ke Allure results jodke ek report banao
  allure-report:
    name: Allure report
    needs: [test, e2e-bridge]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      # Restore historical run trends from previous GitHub Actions cache
      - name: Restore previous Allure history
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Inject previous history into Allure results
        run: |
          if [ -d "allure-history" ] && [ "$(ls -A allure-history 2>/dev/null)" ]; then
            echo "Restoring previous Allure history to allure-results/history..."
            mkdir -p allure-results/history
            cp -r allure-history/* allure-results/history/
          else
            echo "No previous Allure history found. Starting new trend line."
          fi

      - name: Generate Allure report
        run: npx allure generate allure-results -o allure-report

      - name: Persist generated history for future runs
        run: |
          if [ -d "allure-report/history" ]; then
            echo "Preserving allure-report/history into allure-history cache directory..."
            mkdir -p allure-history
            cp -r allure-report/history/* allure-history/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      # GitHub Pages par publish (PR par nahi, sirf main/schedule/manual)
      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # Job 3: GitHub Pages deploy (link: https://<username>.github.io/<repo>/)
  deploy-report:
    name: Publish report to GitHub Pages
    needs: allure-report
    if: ${{ !cancelled() && needs.allure-report.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 4: Docker Smoke Verification (Isolated Container Runtime)
  docker:
    name: Docker Smoke Test (Admin Portal)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: playwright-huzeif:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: |
          mkdir -p playwright-report test-results allure-results
          docker run --rm --ipc=host \
            -e TEST_ENV="${{ env.TEST_ENV }}" \
            -e ORDERING_DEV_URL="${{ env.ORDERING_DEV_URL }}" \
            -e ORDERING_DEV_USER="${{ env.ORDERING_DEV_USER }}" \
            -e ORDERING_DEV_PASSWORD="${{ env.ORDERING_DEV_PASSWORD }}" \
            -e ADMIN_DEV_URL="${{ env.ADMIN_DEV_URL }}" \
            -e ADMIN_DEV_USER="${{ env.ADMIN_DEV_USER }}" \
            -e ADMIN_DEV_PASSWORD="${{ env.ADMIN_DEV_PASSWORD }}" \
            -e FULFILLMENT_DEV_URL="${{ env.FULFILLMENT_DEV_URL }}" \
            -e FULFILLMENT_DEV_USER="${{ env.FULFILLMENT_DEV_USER }}" \
            -e FULFILLMENT_DEV_PASSWORD="${{ env.FULFILLMENT_DEV_PASSWORD }}" \
            -e ORDERING_STAGING_URL="${{ env.ORDERING_STAGING_URL }}" \
            -e ORDERING_STAGING_USER="${{ env.ORDERING_STAGING_USER }}" \
            -e ORDERING_STAGING_PASSWORD="${{ env.ORDERING_STAGING_PASSWORD }}" \
            -e ADMIN_STAGING_URL="${{ env.ADMIN_STAGING_URL }}" \
            -e ADMIN_STAGING_USER="${{ env.ADMIN_STAGING_USER }}" \
            -e ADMIN_STAGING_PASSWORD="${{ env.ADMIN_STAGING_PASSWORD }}" \
            -e FULFILLMENT_STAGING_URL="${{ env.FULFILLMENT_STAGING_URL }}" \
            -e FULFILLMENT_STAGING_USER="${{ env.FULFILLMENT_STAGING_USER }}" \
            -e FULFILLMENT_STAGING_PASSWORD="${{ env.FULFILLMENT_STAGING_PASSWORD }}" \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            -v "$PWD/allure-results:/app/allure-results" \
            playwright-huzeif:ci npx playwright test --project=admin

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-docker
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Docker run ke Allure results (alag naam, taaki main combined report mein na mile)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: docker-allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

  # Job 5: Send Status Notification via Email & Add Summary
  notify:
    name: Notification & Summary
    needs: [test, e2e-bridge, allure-report, deploy-report, docker]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Calculate test outcome
        id: outcome
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.e2e-bridge.result }}" = "success" ] && [ "${{ needs.docker.result }}" = "success" ]; then
            echo "status_title=PASSED" >> $GITHUB_OUTPUT
            echo "status_color=#28a745" >> $GITHUB_OUTPUT
            echo "status_badge=✅ SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "status_title=FAILED" >> $GITHUB_OUTPUT
            echo "status_color=#dc3545" >> $GITHUB_OUTPUT
            echo "status_badge=❌ FAILURE" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Actions Job Summary
        run: |
          echo "## 🧪 Playwright CI/CD Test Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Overall Status** | ${{ steps.outcome.outputs.status_badge }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ env.TEST_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Ref** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} (${{ github.event_name }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Apps Tested** | Online Ordering, Admin Portal, Fulfillment App, Cross-App E2E Bridge |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Reports:" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **[Live Allure Report (GitHub Pages)](https://huzeif1994.github.io/test/)**" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Downloadable HTML artifacts are listed below under **Artifacts**." >> $GITHUB_STEP_SUMMARY

      - name: Send status email via Outlook
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Playwright CI] ${{ steps.outcome.outputs.status_badge }} - ${{ env.TEST_ENV }} (${{ github.ref_name }})"
          to: huzeif.shaikh@ftxinfotech.com
          from: Playwright Automation <${{ secrets.MAIL_USERNAME }}>
          secure: false
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f7f9fa; margin: 0; padding: 24px; color: #333; }
                .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e1e4e8; }
                .header { background: #24292e; color: #ffffff; padding: 20px 24px; }
                .header h1 { margin: 0; font-size: 20px; font-weight: 600; }
                .content { padding: 24px; }
                .badge { display: inline-block; padding: 6px 14px; border-radius: 4px; color: #ffffff; font-weight: bold; background-color: ${{ steps.outcome.outputs.status_color }}; margin-bottom: 16px; font-size: 14px; }
                table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 24px; }
                td { padding: 10px 12px; border-bottom: 1px solid #eaecef; font-size: 14px; }
                td.label { font-weight: 600; color: #586069; width: 140px; }
                .btn { display: inline-block; background-color: #0366d6; color: #ffffff !important; text-decoration: none; padding: 12px 22px; border-radius: 6px; font-weight: 600; font-size: 14px; margin-right: 10px; }
                .btn-secondary { background-color: #24292e; }
                .footer { padding: 16px 24px; background: #f6f8fa; border-top: 1px solid #e1e4e8; font-size: 12px; color: #6a737d; text-align: center; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h1>🚀 Playwright Automated CI/CD Report</h1>
                </div>
                <div class="content">
                  <div class="badge">${{ steps.outcome.outputs.status_badge }}</div>
                  <p>Aapka automated test suite execution complete ho chuka hai. Details neeche di gayi hain:</p>
                  <table>
                    <tr><td class="label">Status:</td><td><strong>${{ steps.outcome.outputs.status_title }}</strong></td></tr>
                    <tr><td class="label">Environment:</td><td><strong>${{ env.TEST_ENV }}</strong></td></tr>
                    <tr><td class="label">Branch:</td><td>${{ github.ref_name }}</td></tr>
                    <tr><td class="label">Commit:</td><td><code>${{ github.sha }}</code></td></tr>
                    <tr><td class="label">Triggered By:</td><td>${{ github.actor }} (${{ github.event_name }})</td></tr>
                    <tr><td class="label">Apps Tested:</td><td>Online Ordering, Admin Portal, Fulfillment App, Cross-App E2E Bridge</td></tr>
                  </table>
                  <div>
                    <a href="https://huzeif1994.github.io/test/" class="btn">📊 View Live Allure Report</a>
                    <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="btn btn-secondary">🔍 View GitHub Action Run</a>
                  </div>
                </div>
                <div class="footer">
                  This is an automated notification from Playwright CI/CD pipeline.
                </div>
              </div>
            </body>
            </html>
